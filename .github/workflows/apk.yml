name: APK oluştur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o android-project.zip -d proje
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}
        working-directory: proje
      - run: cp proje/app/build/outputs/apk/release/app-release.apk PiyasaAnalisti.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Piyasa Analisti v${{ github.run_number }}
          files: PiyasaAnalisti.apk
          make_latest: true

name: APK oluştur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: En son yüklenen zip'i aç
        run: |
          ZIP=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | tail -n 1)
          echo "Kullanılan zip: $ZIP"
          unzip -o "$ZIP" -d proje
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}
        working-directory: proje
      - run: cp proje/app/build/outputs/apk/release/app-release.apk PiyasaAnalisti.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Piyasa Analisti v${{ github.run_number }}
          files: PiyasaAnalisti.apk
          make_latest: true
